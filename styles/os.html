<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Yousef Mohammed, IoT & AI developer. Portfolio as a Linux desktop with a working terminal.">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yousef OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: a Linux desktop. The portfolio is the OS: windows are sections, a working terminal,
   a file manager of projects, and a live point-cloud wallpaper that morphs to match the focused app. */
:root {
  --bg: #08090d;
  --surface: #12151b;
  --surface-2: #1a1e26;
  --glass: rgba(18, 21, 27, .78);
  --line: #262b35;
  --fg: #ede9e2;
  --muted: #8b909a;
  --accent: #ffb547;
  --accent-ink: #1a1203;
  --cool: #7cc4ff;
  --ok: #6fdc9a;
  --err: #ff7a7a;

  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ar: "Reem Kufi", "Noto Kufi Arabic", sans-serif;
  --bar-h: 34px;
  --dock-h: 74px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; overflow: hidden; user-select: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
::selection { background: var(--accent); color: var(--accent-ink); }

/* ---------- wallpaper ---------- */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.wall-grad { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(70rem 40rem at 80% 10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
              radial-gradient(60rem 40rem at 10% 90%, color-mix(in srgb, var(--cool) 7%, transparent), transparent 60%); }
.wall-label { position: fixed; right: 24px; bottom: calc(var(--dock-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 1; text-align: right; pointer-events: none; }
.wall-label .big { font-family: var(--display); font-weight: 900; font-size: clamp(2.5rem, 7vw, 5.5rem); line-height: .85; text-transform: uppercase; color: color-mix(in srgb, var(--fg) 10%, transparent); }
.wall-label .mono b { color: var(--accent); font-weight: 500; }

/* ---------- top bar ---------- */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 9000; height: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 10px 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: rgba(8, 9, 13, .72); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: .76rem; }
.topbar .l, .topbar .r { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ws { display: flex; gap: 4px; }
.ws span { width: 22px; height: 20px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); }
.ws span.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.focused-app { color: var(--fg); padding-inline: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .c { position: absolute; left: 50%; transform: translateX(-50%); color: var(--fg); white-space: nowrap; }
.pill { padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); }
@media (max-width: 760px) { .topbar .r .hide-sm, .ws { display: none; } .topbar .c { position: static; transform: none; } }

/* ---------- desktop icons ---------- */
.desk { position: fixed; z-index: 2; top: calc(var(--bar-h) + 18px + env(safe-area-inset-top, 0px)); left: 14px; display: grid; gap: 6px; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 92px); max-height: calc(100% - var(--bar-h) - var(--dock-h) - 60px); }
.dicon { width: 92px; height: 92px; display: grid; justify-items: center; align-content: center; gap: 6px; border: 1px solid transparent; border-radius: 10px; background: none; cursor: pointer; padding: 6px; }
.dicon:hover, .dicon:focus-visible { background: rgba(255, 255, 255, .05); border-color: var(--line); }
.dicon .ic { width: 44px; height: 44px; }
.dicon span { font: 500 .72rem var(--mono); text-align: center; line-height: 1.2; text-shadow: 0 1px 6px #000; overflow-wrap: anywhere; }
@media (max-width: 760px) { .desk { display: none; } }

/* ---------- icons ---------- */
.ic { display: grid; place-items: center; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); }
.ic svg { width: 58%; height: 58%; }
.ic.amber { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ic.cool { background: color-mix(in srgb, var(--cool) 22%, var(--surface-2)); color: var(--cool); }

/* ---------- dock ---------- */
.dock { position: fixed; z-index: 9000; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px; border-radius: 18px;
  background: rgba(18, 21, 27, .7); backdrop-filter: blur(16px); border: 1px solid var(--line); max-width: calc(100% - 16px); }
.dock .sep { width: 1px; align-self: stretch; background: var(--line); margin-inline: 4px; }
.dk { position: relative; width: 48px; height: 48px; padding: 0; border: 0; background: none; cursor: pointer; transform-origin: bottom; }
.dk .ic { width: 100%; height: 100%; }
.dk .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) translateY(4px); white-space: nowrap; font: 500 .7rem var(--mono); padding: 4px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
.dk:hover .tip, .dk:focus-visible .tip { opacity: 1; transform: translateX(-50%); }
.dk::after { content: ""; position: absolute; bottom: -6px; left: 50%; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); transform: translateX(-50%) scale(0); transition: transform .2s; }
.dk.running::after { transform: translateX(-50%) scale(1); }
@media (max-width: 520px) { .dk { width: 40px; height: 40px; } .dock { gap: 4px; padding: 6px 8px; } .dock .ext { display: none; } }

/* ---------- windows ---------- */
.win { position: fixed; z-index: 10; min-width: 320px; min-height: 220px; display: flex; flex-direction: column;
  background: var(--glass); backdrop-filter: blur(22px) saturate(1.2); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset; overflow: hidden; resize: both; }
.win.focused { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.win.max { inset: calc(var(--bar-h) + 8px + env(safe-area-inset-top, 0px)) 8px calc(var(--dock-h) + 14px + env(safe-area-inset-bottom, 0px)) 8px !important; width: auto !important; height: auto !important; resize: none; }
.titlebar { flex: none; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); cursor: grab; touch-action: none; }
.titlebar:active { cursor: grabbing; }
.titlebar .t { flex: 1; min-width: 0; font: 500 .74rem var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win.focused .titlebar .t { color: var(--fg); }
.titlebar .t b { color: var(--accent); font-weight: 500; }
.wbtns { display: flex; gap: 2px; }
.wb { width: 30px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; font: 500 .8rem var(--mono); }
.wb:hover { background: var(--surface-2); color: var(--fg); }
.wb.x:hover { background: var(--err); color: #1a0606; }
.wbody { flex: 1; min-height: 0; overflow: auto; user-select: text; overscroll-behavior: contain; }
.wbody::-webkit-scrollbar { width: 10px; } .wbody::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
@media (max-width: 760px) {
  .win { inset: calc(var(--bar-h) + 6px + env(safe-area-inset-top, 0px)) 6px calc(var(--dock-h) + 12px + env(safe-area-inset-bottom, 0px)) 6px !important; width: auto !important; height: auto !important; min-width: 0; resize: none; }
  .titlebar { cursor: default; }
  .wb.mx { display: none; }
}

/* ---------- shared content ---------- */
.pad { padding: 22px; }
.h-display { font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: .9; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); text-decoration: none; cursor: pointer; font: 600 .88rem var(--body); transition: border-color .2s, background .2s, transform .2s; }
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; }
.chips li { list-style: none; font: .72rem var(--mono); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }

/* about */
.about { display: grid; gap: 22px; }
.about .head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.avatar { width: 84px; height: 84px; flex: none; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 2.6rem; position: relative; }
.avatar::after { content: ""; position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); border: 3px solid var(--surface); }
.about h1 { font-size: clamp(2.6rem, 6vw, 3.8rem); }
.about .ar { font-family: var(--ar); color: var(--accent); font-size: 1.1rem; }
.about p { max-width: 62ch; color: color-mix(in srgb, var(--fg) 82%, var(--muted)); }
.about p strong { color: var(--fg); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.facts div { padding: 12px 14px; display: grid; gap: 2px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.facts b { font-weight: 600; }
.md-h { font: 700 .82rem var(--mono); color: var(--cool); }
.md-h::before { content: "## "; color: var(--muted); }

/* terminal */
.term { font-family: var(--mono); font-size: .84rem; line-height: 1.55; padding: 14px 16px; min-height: 100%; background: rgba(5, 6, 9, .55); cursor: text; }
.term .ln { white-space: pre-wrap; overflow-wrap: anywhere; }
.term .p { color: var(--ok); } .term .p i { color: var(--cool); font-style: normal; }
.term .a { color: var(--accent); } .term .c { color: var(--cool); } .term .m { color: var(--muted); } .term .e { color: var(--err); }
.term a, .term .cmd { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
.term .inrow { display: flex; gap: 8px; align-items: baseline; }
.term input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); font: inherit; caret-color: var(--accent); padding: 0; }
.neo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 22px; align-items: start; }
.neo pre { margin: 0; color: var(--accent); font: inherit; line-height: 1.15; }
@media (max-width: 520px) { .neo { grid-template-columns: minmax(0, 1fr); } .neo pre { display: none; } }

/* files */
.files { display: grid; grid-template-columns: 170px minmax(0, 1fr); height: 100%; }
.side { border-right: 1px solid var(--line); padding: 14px 10px; display: grid; align-content: start; gap: 2px; background: rgba(0,0,0,.15); }
.side button { display: flex; justify-content: space-between; gap: 8px; text-align: left; padding: 7px 10px; border-radius: 7px; border: 0; background: none; cursor: pointer; font: 500 .8rem var(--mono); color: var(--muted); }
.side button:hover { background: var(--surface-2); color: var(--fg); }
.side button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.fmain { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.fbar { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.fbar .path { font: .78rem var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.fbar .path b { color: var(--fg); font-weight: 500; }
.fbar input { width: 180px; max-width: 45%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: .8rem var(--mono); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 14px; align-content: start; overflow: auto; }
.fcard { display: grid; gap: 8px; padding: 12px; text-align: left; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.02); cursor: pointer; transition: border-color .2s, transform .2s, background .2s; }
.fcard:hover, .fcard:focus-visible { border-color: var(--accent); transform: translateY(-2px); background: rgba(255,182,71,.05); }
.fcard .fi { width: 100%; aspect-ratio: 16 / 10; border-radius: 7px; position: relative; display: grid; place-items: center; overflow: hidden;
  background: linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 16px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 16px 100%, var(--bg); }
.fcard .fi b { font-family: var(--display); font-weight: 900; font-size: 1.7rem; line-height: 1; padding-inline: 6px; text-align: center; }
.fcard .fi::before { content: ""; position: absolute; inset: 16%; border: 1.5px solid var(--accent); opacity: .0; transition: opacity .2s, inset .3s; }
.fcard:hover .fi::before { opacity: 1; inset: 10%; }
.fcard .nm { font: 500 .78rem var(--mono); line-height: 1.3; }
.fcard .tg { font: .66rem var(--mono); color: var(--cool); text-transform: uppercase; letter-spacing: .06em; }
.fcard[hidden] { display: none !important; }
.empty { padding: 30px; color: var(--muted); font-family: var(--mono); font-size: .8rem; }
@media (max-width: 620px) { .files { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; } .side { display: flex; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); } }

/* case study */
.case { display: grid; gap: 30px; }
.case h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); }
.case .summary { font-size: 1.02rem; max-width: 64ch; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); border-block: 1px solid var(--line); }
.kpi { padding: 14px 12px 14px 0; display: grid; gap: 4px; min-width: 0; }
.kpi b { font-family: var(--display); font-weight: 700; font-size: 1.8rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sub { font-family: var(--display); font-weight: 900; font-size: 1.6rem; text-transform: uppercase; margin-bottom: 14px; }
.flow { list-style: none; margin: 0; padding: 0 0 0 30px; position: relative; display: grid; }
.flow::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 1px; background: linear-gradient(var(--accent), var(--cool)); }
.flow li { position: relative; padding-bottom: 16px; display: grid; gap: 2px; }
.flow li::before { content: ""; position: absolute; left: -30px; top: 5px; width: 11px; height: 11px; border-radius: 3px; border: 2px solid var(--accent); background: var(--bg); }
.flow h4 { font-family: var(--display); font-weight: 700; font-size: 1.2rem; text-transform: uppercase; line-height: 1.1; }
.flow p { color: var(--muted); font-size: .92rem; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; align-items: start; }
.notes { margin: 0; padding: 0; display: grid; gap: 10px; }
.notes li { list-style: none; position: relative; padding-left: 20px; font-size: .92rem; }
.notes li::before { content: "▸"; position: absolute; left: 0; color: var(--cool); }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 96px) minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: .82rem; }
.trk { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.fill { display: block; height: 100%; background: var(--cool); border-radius: 999px; transform-origin: left; }
.bar-row.best .fill { background: var(--accent); }
.bar-row .v { font: 500 .74rem var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar-row.best .v, .bar-row.best .l { color: var(--accent); }
.status { display: inline-flex; align-items: center; gap: 8px; font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* experience: journal */
.journal { font-family: var(--mono); font-size: .82rem; }
.jhead { padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.jentry { border-bottom: 1px solid var(--line); }
.jentry summary { list-style: none; display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 14px; padding: 14px 16px; cursor: pointer; align-items: baseline; }
.jentry summary::-webkit-details-marker { display: none; }
.jentry summary:hover { background: rgba(255,255,255,.03); }
.jentry .when { color: var(--cool); }
.jentry .what { font-family: var(--body); font-size: .98rem; }
.jentry .what b { font-family: var(--display); font-size: 1.35rem; text-transform: uppercase; font-weight: 700; display: block; line-height: 1.05; }
.jentry .what span { color: var(--muted); font-size: .86rem; }
.jentry .tog { color: var(--accent); }
.jentry[open] .tog { transform: rotate(90deg); }
.jentry .tog { display: inline-block; transition: transform .2s; }
.jentry ul { margin: 0; padding: 0 16px 16px 140px; display: grid; gap: 6px; font-family: var(--body); font-size: .9rem; }
.jentry li { list-style: none; position: relative; padding-left: 18px; }
.jentry li::before { content: "▸"; position: absolute; left: 0; color: var(--cool); }
@media (max-width: 560px) { .jentry summary { grid-template-columns: minmax(0, 1fr) auto; } .jentry .when { grid-column: 1 / -1; } .jentry ul { padding-left: 16px; } }

/* stack: package list */
.pkgs { font-family: var(--mono); font-size: .82rem; padding: 14px 16px; }
.pkgs .cmdline { color: var(--ok); margin-bottom: 10px; }
.pgroup { margin-bottom: 14px; }
.pgroup h4 { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.pgroup .list { display: flex; flex-wrap: wrap; gap: 6px; }
.pgroup .list span { padding: 4px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.pgroup .list span i { font-style: normal; color: var(--accent); }

/* contact */
.contact { display: grid; gap: 18px; }
.mailrow { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.mailrow code { font: 500 1rem var(--mono); user-select: all; overflow-wrap: anywhere; }
.contact h2 { font-size: clamp(2.2rem, 5vw, 3.4rem); }
.contact h2 span { color: var(--accent); }

/* ---------- context menu / toast ---------- */
.ctx { position: fixed; z-index: 9500; min-width: 210px; padding: 6px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.ctx button { display: flex; justify-content: space-between; width: 100%; gap: 16px; padding: 8px 10px; border: 0; background: none; border-radius: 6px; text-align: left; cursor: pointer; font: 500 .8rem var(--mono); }
.ctx button:hover { background: var(--surface-2); color: var(--accent); }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.toast { position: fixed; z-index: 9400; right: 14px; top: calc(var(--bar-h) + 12px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100% - 28px)); padding: 14px 16px; border-radius: 12px; background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--line); display: grid; gap: 4px; }
.toast b { font-size: .92rem; }
.toast p { font-size: .84rem; color: var(--muted); }
.toast code { font-family: var(--mono); color: var(--accent); }

/* ---------- boot ---------- */
.boot { position: fixed; inset: 0; z-index: 10000; background: #000; padding: calc(24px + env(safe-area-inset-top, 0px)) 22px 24px; font: .8rem/1.6 var(--mono); color: #c8c8c8; overflow: hidden; cursor: pointer; }
.boot .ok { color: var(--ok); } .boot .hl { color: var(--accent); }
.boot .skip { position: absolute; right: 22px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); color: var(--muted); }
.boot .logo { font-family: var(--display); font-weight: 900; font-size: clamp(3rem, 12vw, 7rem); line-height: .85; color: var(--fg); text-transform: uppercase; margin-bottom: 18px; }
.boot .logo span { color: var(--accent); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const small = () => innerWidth <= 760;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const $ = (s, r = document) => r.querySelector(s);

  /* ===================== ICONS ===================== */
  const SVG = {
    term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l5 5-5 5"/><path d="M12 18h8"/></svg>',
    folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
    log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h2M9 6h11M4 12h2M9 12h11M4 18h2M9 18h7"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>',
    git: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>',
    in: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.1c0-1.22-.02-2.78-1.7-2.78-1.7 0-1.96 1.33-1.96 2.7V21h-4z"/></svg>',
    k: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h3v8.2L15.6 3h3.7l-6.6 8 6.9 10h-3.8l-5.1-7.5L9 15.4V21H6z"/></svg>'
  };

  /* ===================== WALLPAPER (point cloud) ===================== */
  const N = small() ? 2200 : 3600;
  const R = (a, b) => a + Math.random() * (b - a);
  const G = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  function fit(pts) {
    const out = new Float32Array(N * 3);
    for (let i = pts.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
    for (let i = 0; i < N; i++) { const p = pts[i % pts.length], ex = i >= pts.length ? .03 : 0; out[i * 3] = p[0] + G() * ex; out[i * 3 + 1] = p[1] + G() * ex; out[i * 3 + 2] = p[2] + G() * ex; }
    return out;
  }
  function faceShape() {
    const pts = [], rx = 1.15, ry = 1.55, rz = 1.05;
    const surfZ = (x, y) => rz * Math.sqrt(Math.max(0, 1 - (x / rx) ** 2 - (y / ry) ** 2));
    while (pts.length < N * .6) { const u = R(-1, 1), ph = R(0, Math.PI * 2), s = Math.sqrt(1 - u * u); let x = s * Math.cos(ph) * rx; const y = u * ry, z = s * Math.sin(ph) * rz; if (z < -.25) continue; if (y < 0) x *= 1 - (-y / ry) * .3; pts.push([x, y, z]); }
    const on = (x, y, l = .03) => pts.push([x, y, surfZ(x, y) + l]);
    [-.42, .42].forEach(cx => {
      for (let i = 0; i < 220; i++) { const a = R(0, 6.283); on(cx + Math.cos(a) * .2, .28 + Math.sin(a) * .09); }
      for (let i = 0; i < 80; i++) { const a = R(0, 6.283), r = Math.random() * .06; on(cx + Math.cos(a) * r, .28 + Math.sin(a) * r, .05); }
      for (let i = 0; i < 130; i++) { const t = R(-1, 1); on(cx + t * .26, .55 + (1 - t * t) * .06); }
    });
    for (let i = 0; i < 220; i++) { const t = Math.random(), y = .22 - t * .55; pts.push([G() * .02, y, surfZ(0, y) + .05 + t * .3]); }
    for (let i = 0; i < 280; i++) { const t = R(-1, 1), up = Math.random() < .5; on(t * .38, -.68 + (up ? .05 : -.04) * (1 - t * t) + (up ? 0 : -(1 - t * t) * .06)); }
    return fit(pts);
  }
  const HAND = [[.50,.95],[.36,.86],[.26,.74],[.19,.63],[.13,.54],[.38,.55],[.35,.40],[.33,.30],[.31,.20],[.49,.52],[.49,.35],[.49,.24],[.49,.12],[.59,.55],[.62,.40],[.63,.30],[.64,.21],[.68,.61],[.74,.50],[.77,.42],[.80,.34]];
  const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  function handShape() {
    const P = HAND.map(([x, y]) => [(x - .5) * 4.2, (.55 - y) * 4.2, -((x - .5) ** 2) * 1.6]), pts = [];
    BONES.forEach(([a, b]) => { const A = P[a], B = P[b], n = Math.round(Math.hypot(B[0] - A[0], B[1] - A[1]) * 230); for (let i = 0; i < n; i++) { const t = Math.random(); pts.push([A[0] + (B[0] - A[0]) * t + G() * .035, A[1] + (B[1] - A[1]) * t + G() * .035, A[2] + G() * .035]); } });
    P.forEach(p => { for (let i = 0; i < 45; i++) pts.push([p[0] + G() * .045, p[1] + G() * .045, p[2] + G() * .045]); });
    return fit(pts);
  }
  function galaxyShape() { const pts = []; for (let i = 0; i < N; i++) { const arm = i % 3, r = Math.pow(Math.random(), .7) * 5.2 + .15, a = arm * 2.094 + r * .85 + G() * .28 / (r * .4 + .4); pts.push([Math.cos(a) * r, G() * .12 * (1.2 - r / 6), Math.sin(a) * r]); } return fit(pts); }
  function espShape() {
    const pts = [];
    const edge = (x0, y0, x1, y1, z, n) => { for (let i = 0; i < n; i++) { const t = Math.random(), s = (Math.random() * 4) | 0; const p = s === 0 ? [x0 + (x1 - x0) * t, y0] : s === 1 ? [x1, y0 + (y1 - y0) * t] : s === 2 ? [x0 + (x1 - x0) * t, y1] : [x0, y0 + (y1 - y0) * t]; pts.push([p[0], p[1], z]); } };
    const fill = (x0, y0, x1, y1, z, n) => { for (let i = 0; i < n; i++) pts.push([R(x0, x1), R(y0, y1), z]); };
    edge(-1, -1.9, 1, 1.9, 0, 520); fill(-1, -1.9, 1, 1.9, 0, 480); edge(-.78, .15, .78, 1.75, .14, 400); fill(-.78, .15, .78, 1.75, .14, 480);
    for (let i = 0; i < 360; i++) { const t = Math.random(), seg = Math.floor(t * 12), f = (t * 12) % 1; pts.push([-.65 + t * 1.3, 1.5 + (seg % 2 && f < .85 ? .18 : 0), .17]); }
    for (const sd of [-1, 1]) for (let k = 0; k < 19; k++) { const y = -1.75 + k * (2.95 / 18); for (let i = 0; i < 16; i++) { const a = R(0, 6.283); pts.push([sd * .9 + Math.cos(a) * .045, y + Math.sin(a) * .045, .02]); } }
    edge(-.32, -2, .32, -1.68, .1, 160);
    const ax = -.35, az = .3;
    return fit(pts.map(([x, y, z]) => { const y1 = y * Math.cos(ax) - z * Math.sin(ax), z1 = y * Math.sin(ax) + z * Math.cos(ax); return [x * Math.cos(az) - y1 * Math.sin(az), x * Math.sin(az) + y1 * Math.cos(az), z1]; }));
  }
  function textShape(word) {
    const c = document.createElement('canvas'), w = 1400, h = 360; c.width = w; c.height = h;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '900 300px "Big Shoulders Display", Impact, sans-serif'; x.fillText(word, w / 2, h / 2 + 10);
    const d = x.getImageData(0, 0, w, h).data, pts = [];
    for (let py = 0; py < h; py += 3) for (let px = 0; px < w; px += 3) if (d[(py * w + px) * 4 + 3] > 128) pts.push([(px - w / 2) / w * 8.4, -(py - h / 2) / w * 8.4, G() * .06]);
    return fit(pts.length ? pts : [[0, 0, 0]]);
  }
  const SHAPE_NAMES = ['face_mesh', 'hand_landmarks', 'project_galaxy', 'esp32_devkit', 'hello_world'];
  let glOK = false, renderer, scene, camera, group, geo, mat, shapes = null, from = null, to = null, delays;
  const morph = { p: 1 }, view = { tilt: 0, scale: 1, spin: 0 }, mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  let curShape = 0;
  function initGL() {
    if (!window.THREE) return;
    try { renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: false, alpha: true }); } catch { return; }
    glOK = true;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight, false);
    scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, .1, 100); camera.position.z = 9;
    group = new THREE.Group(); scene.add(group);
    geo = new THREE.BufferGeometry();
    const col = new Float32Array(N * 3), size = new Float32Array(N), rnd = new Float32Array(N);
    const css = getComputedStyle(document.documentElement);
    const C = ['--accent', '--cool', '--fg'].map(v => new THREE.Color(css.getPropertyValue(v).trim()));
    for (let i = 0; i < N; i++) { const r = Math.random(), c = r < .22 ? C[0] : r < .7 ? C[1] : C[2]; col.set([c.r, c.g, c.b], i * 3); size[i] = R(2.5, 6) * (Math.random() < .04 ? 2.2 : 1); rnd[i] = Math.random(); }
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 1));
    mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
      uniforms: { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uOp: { value: .9 } },
      vertexShader: `attribute float aSize; attribute float aRnd; uniform float uTime; uniform float uPR; varying vec3 vColor; varying float vTw;
        void main(){ vColor = color; vec3 p = position + vec3(sin(uTime*.8+aRnd*40.), cos(uTime*.7+aRnd*30.), sin(uTime*.6+aRnd*20.))*.018;
          vec4 mv = modelViewMatrix * vec4(p,1.); vTw = .6+.4*sin(uTime*2.+aRnd*60.); gl_PointSize = aSize*uPR*(5./-mv.z); gl_Position = projectionMatrix*mv; }`,
      fragmentShader: `uniform float uOp; varying vec3 vColor; varying float vTw;
        void main(){ float a = smoothstep(.5,.0,length(gl_PointCoord-.5)); gl_FragColor = vec4(vColor, a*a*uOp*vTw); }` });
    group.add(new THREE.Points(geo, mat));
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  }
  function buildShapes() {
    shapes = [faceShape(), handShape(), galaxyShape(), espShape(), textShape('YOUSEF')];
    delays = Float32Array.from({ length: N }, () => Math.random() * .35);
    from = Float32Array.from(shapes[2], v => v * 2.4); to = shapes[0]; morph.p = 0;
    if (G_) gsap.to(morph, { p: 1, duration: 2.4, ease: 'power3.inOut' }); else morph.p = 1;
  }
  function setShape(i) {
    if (!glOK || !shapes || i === curShape) return;
    curShape = i;
    from = Float32Array.from(geo.attributes.position.array); to = shapes[i];
    $('#wall-name').textContent = SHAPE_NAMES[i];
    gsap.killTweensOf(morph); gsap.killTweensOf(view);
    if (G_) {
      morph.p = 0; gsap.to(morph, { p: 1, duration: 1.8, ease: 'power3.inOut' });
      gsap.to(view, { tilt: i === 2 ? .95 : 0, scale: i === 2 ? 1.1 : i === 4 ? .85 : 1, duration: 1.8, ease: 'power3.inOut' });
    } else { morph.p = 1; view.tilt = i === 2 ? .95 : 0; view.scale = i === 4 ? .85 : 1; }
  }
  const t0 = performance.now();
  function render(now) {
    const t = (now - t0) / 1000;
    if (glOK && shapes) {
      mouse.x += (mouse.tx - mouse.x) * .04; mouse.y += (mouse.ty - mouse.y) * .04;
      const p = geo.attributes.position.array, f = morph.p;
      for (let i = 0; i < N; i++) {
        let ti = Math.min(1, Math.max(0, (f - delays[i]) / .65)); ti = ti * ti * (3 - 2 * ti);
        const j = i * 3; p[j] = from[j] + (to[j] - from[j]) * ti; p[j + 1] = from[j + 1] + (to[j + 1] - from[j + 1]) * ti; p[j + 2] = from[j + 2] + (to[j + 2] - from[j + 2]) * ti;
      }
      geo.attributes.position.needsUpdate = true;
      const sm = small();
      group.position.set(sm ? 0 : 1.6, sm ? .3 : 0, 0);
      group.scale.setScalar(view.scale * (sm ? .62 : Math.max(.75, Math.min(1, innerWidth / innerHeight / 1.3))));
      const gal = curShape === 2 ? 1 : 0;
      group.rotation.x = view.tilt + mouse.y * .2;
      group.rotation.y = (reduce ? 0 : Math.sin(t * .35) * .35 * (1 - gal) + t * .12 * gal) + mouse.x * .4;
      group.rotation.z = gal * .25;
      mat.uniforms.uTime.value = reduce ? 0 : t;
      mat.uniforms.uOp.value = sm ? .5 : .85;
      renderer.render(scene, camera);
    }
    requestAnimationFrame(render);
  }
  addEventListener('pointermove', e => { mouse.tx = (e.clientX / innerWidth - .5) * 2; mouse.ty = (e.clientY / innerHeight - .5) * 2; });
  initGL();

  /* ===================== APPS ===================== */
  function caseHTML(p) {
    const kpis = p.kpis.map(([v, l]) => `<div class="kpi"><b>${esc(v)}</b><span class="mono">${esc(l)}</span></div>`).join('');
    const flow = p.flow.map(([h, d]) => `<li><h4>${esc(h)}</h4><p>${esc(d)}</p></li>`).join('');
    let bars = '';
    if (p.bars) {
      const vals = p.bars.items.map(i => i[1]), max = Math.max(...vals), best = p.bars.better === 'low' ? Math.min(...vals) : max;
      bars = `<div><h3 class="sub">Numbers</h3><div class="bars"><span class="mono">${esc(p.bars.cap)}</span>${p.bars.items.map(([l, v]) => `<div class="bar-row ${v === best ? 'best' : ''}"><span class="l">${esc(l)}</span><span class="trk"><span class="fill" style="width:${(v / max * 100).toFixed(1)}%"></span></span><span class="v">${v}${p.bars.unit ? ' ' + p.bars.unit : ''}</span></div>`).join('')}</div></div>`;
    }
    const code = p.repo ? `<a class="btn primary" href="${p.repo}" target="_blank" rel="noopener">View code on GitHub ↗</a>`
      : p.repoAlt ? `<a class="btn primary" href="${p.repoAlt[1]}" target="_blank" rel="noopener">${esc(p.repoAlt[0])} ↗</a>`
      : `<span class="btn" aria-disabled="true">${esc(p.repoNote || 'Private repo')}</span>`;
    const extra = p.extra ? `<a class="btn" href="${p.extra[1]}" target="_blank" rel="noopener">${esc(p.extra[0])} ↗</a>` : '';
    const i = PROJECTS.indexOf(p), nx = PROJECTS[(i + 1) % PROJECTS.length];
    return `<div class="pad case">
      <div style="display:grid;gap:12px">
        <span class="mono" style="color:var(--cool)">${esc(p.tag)}</span>
        ${p.status ? `<span class="status">${esc(p.status)}</span>` : ''}
        <h2 class="h-display">${esc(p.title)}</h2>
        <p class="summary">${esc(p.summary)}</p>
        <div class="row-btns">${code}${extra}</div>
      </div>
      <div class="kpis">${kpis}</div>
      <div class="cols">
        <div><h3 class="sub">How it works</h3><ol class="flow">${flow}</ol></div>
        <div style="display:grid;gap:26px">
          ${bars}
          ${p.notes.length ? `<div><h3 class="sub">Decisions</h3><ul class="notes">${p.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>` : ''}
          <div><h3 class="sub">Stack</h3><ul class="chips">${p.stack.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
        </div>
      </div>
      <div class="row-btns" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:16px">
        <span class="mono">${pad(i + 1)} / ${pad(PROJECTS.length)}</span>
        <button class="btn" type="button" data-proj="${nx.id}">Next: ${esc(nx.title)} →</button>
      </div>
    </div>`;
  }

  const APPS = {
    about: { title: 'README.md', path: '~/', icon: 'doc', label: 'README.md', shape: 0, w: 640, h: 560,
      html: () => `<div class="pad about">
        <div class="head"><div class="avatar" aria-hidden="true">Y</div>
          <div style="display:grid;gap:6px"><span class="ar" lang="ar">يوسف محمد عبد الكريم</span><h1 class="h-display">Yousef Mohammed</h1><span class="mono">IoT &amp; AI Developer · Cairo, Egypt</span></div></div>
        <p>Final-year Computer Science student on the <strong>Robotics &amp; AI track</strong> at Helwan National University, and <strong>IoT &amp; AI developer at VoltX</strong>, building embedded ML pipelines on ESP32 and FreeRTOS. I also lead a university team building a <strong>story-captioning system</strong>.</p>
        <p>I build computer vision, RAG and embedded systems that run in real time. I care about the last mile: cutting a colour lookup from 17.3&nbsp;ms to 0.5&nbsp;ms is what turns a demo into a tool.</p>
        <span class="md-h">quick facts</span>
        <div class="facts">
          <div><span class="mono">Focus</span><b>CV · RAG · Embedded</b></div>
          <div><span class="mono">Projects</span><b>${PROJECTS.length} on this machine</b></div>
          <div><span class="mono">Graduating</span><b>2027</b></div>
          <div><span class="mono">Languages</span><b>Arabic, English</b></div>
        </div>
        <div class="row-btns">
          <button class="btn primary" type="button" data-app="files">Open projects/</button>
          <button class="btn" type="button" data-app="terminal">Open terminal</button>
          <button class="btn" type="button" data-app="contact">Contact</button>
        </div>
      </div>` },
    terminal: { title: 'terminal', path: 'ym@cachyos: ~', icon: 'term', label: 'terminal', shape: 1, w: 620, h: 420, amber: true,

  // top bar clock + fake cpu
  const clock = $('#clock');
  const tick = () => { try { clock.textContent = 'Cairo ' + new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date()); } catch {} };
  tick(); setInterval(tick, 15000);
  setInterval(() => { $('#cpu').textContent = 'cpu ' + (2 + Math.round(Math.random() * 9 + wins.size * 2)) + '%'; }, 1800);

  function toast(html) {
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = html; document.body.appendChild(t);
    if (G_) gsap.fromTo(t, { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: .6, ease: 'expo.out' });
    setTimeout(() => { if (G_) gsap.to(t, { x: 40, opacity: 0, duration: .4, onComplete: () => t.remove() }); else t.remove(); }, 7000);
  }

  /* ===================== BOOT ===================== */
  function startDesktop() {
    if (glOK) { buildShapes(); requestAnimationFrame(render); }
    if (small()) { openApp('about'); }
    else { openApp('about'); setTimeout(() => { const w = openApp('terminal'); const tw = wins.get('terminal'); if (tw) { tw.el.style.left = Math.max(140, innerWidth - 680) + 'px'; tw.el.style.top = Math.max(80, innerHeight - 540) + 'px'; } }, 350); }
    if (G_) gsap.from('.dk', { y: 60, opacity: 0, duration: .8, ease: 'expo.out', stagger: .04, delay: .2 });
    if (G_) gsap.from('.dicon', { x: -30, opacity: 0, duration: .7, ease: 'expo.out', stagger: .05, delay: .3 });
    setTimeout(() => toast(`<b>Welcome to YousefOS</b><p>Drag windows, open <code>projects/</code> from the dock, or type <code>help</code> in the terminal. Right-click the desktop for more.</p>`), 1600);
  }
  const boot = $('#boot'), blog = $('#boot-log');
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2000))]) : Promise.resolve();
  if (reduce || !window.gsap) { boot.remove(); fontsReady.then(startDesktop); return; }
  const lines = [
    ['ok', 'Started Load Kernel Module robotics_ai'], ['ok', 'Mounted /home/ym/projects (' + PROJECTS.length + ' entries)'], ['ok', 'Started face_mesh.service · 468 landmarks'],
    ['ok', 'Started hand_landmarker.service · 21 points'], ['ok', 'Reached target ESP32 FreeRTOS scheduler'], ['ok', 'Started faiss-index.service · 188 chunks'],
    ['ok', 'Started yolo11-detector.service'], ['ok', 'Reached target Network (VoltX)'], ['hl', 'Starting YousefOS desktop …']
  ];
  let i = 0, finished = false;
  const finish = () => {
    if (finished) return; finished = true;
    gsap.to(boot, { opacity: 0, duration: .5, ease: 'power2.out', onComplete: () => boot.remove() });
    fontsReady.then(startDesktop);
  };
  const step = () => {
    if (finished) return;
    if (i >= lines.length) { setTimeout(finish, 350); return; }
    const [k, t] = lines[i++];
    const d = document.createElement('div');
    d.innerHTML = k === 'ok' ? `[  <span class="ok">OK</span>  ] ${esc(t)}` : `<span class="hl">${esc(t)}</span>`;
    blog.appendChild(d);
    setTimeout(step, 120 + Math.random() * 110);
  };
  gsap.from('.boot .logo', { y: 30, opacity: 0, duration: .8, ease: 'expo.out' });
  setTimeout(step, 400);
  boot.addEventListener('click', finish);
  addEventListener('keydown', function sk() { if (!finished) { finish(); } removeEventListener('keydown', sk); });
})();
</script>

</body>
